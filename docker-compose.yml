services:
  mongodb:
    image: mongo:8
    container_name: devops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
    container_name: devops-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/devops_ai_chat
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
    container_name: devops-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data: